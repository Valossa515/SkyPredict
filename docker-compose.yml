services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: skypredict
    ports:
      - "5000:5000"
    environment:
      - METEOSTAT_API_KEY=${METEOSTAT_API_KEY}
      - METEOSTAT_API_HOST=${METEOSTAT_API_HOST}
      - AEROAPI_KEY=${AEROAPI_KEY}
      - MONGO_URI=${MONGO_URI}
      - MONGOD_DB=${MONGOD_DB}
      - MONGO_COLLECTION=${MONGO_COLLECTION}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
